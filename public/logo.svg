<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <style>
    .ink { fill: #142229; stroke: #142229; }
    @media (prefers-color-scheme: dark) { .ink { fill: #e4ecef; stroke: #e4ecef; } }
  </style>
  <defs>
    <!-- one hand, corner of the L at 0,0: index finger to the right, thumb up -->
    <g id="hand" class="ink" stroke-linecap="round">
      <path d="M0 0 H184" stroke-width="34" fill="none"/>
      <path d="M0 0 V-160" stroke-width="38" fill="none"/>
      <rect x="-50" y="-14" width="66" height="96" rx="28" stroke="none"/>
      <path d="M-8 32 H36 M-8 56 H34 M-8 80 H28" stroke-width="24" fill="none"/>
      <path d="M-26 64 L-66 122" stroke-width="70" fill="none"/>
    </g>
  </defs>
  <g transform="translate(256 256) scale(0.86) translate(-256 -256) rotate(-9 256 256)">
    <rect x="170" y="186" width="86" height="70" fill="#e0412f"/>
    <rect x="256" y="186" width="86" height="70" fill="#0b8576"/>
    <rect x="170" y="256" width="86" height="70" fill="#e3a008"/>
    <rect x="256" y="256" width="86" height="70" fill="#4f3fd6"/>
    <use href="#hand" transform="translate(148 348)"/>
    <use href="#hand" transform="rotate(180 256 256) translate(148 348)"/>
  </g>
</svg>
